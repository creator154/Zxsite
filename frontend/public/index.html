<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1f2430;--muted:#5d6577;--accent:#4f46e5;--line:#e3e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--ink:#eceef5;--muted:#9aa2b5;--accent:#8b85ff;--line:#2a2e3b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{text-align:center;padding:36px 16px 20px}
header h1{margin:0;font-size:2.4rem}
header p{margin:6px 0 0;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 16px 20px}
nav a{padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
nav a span{font-size:.65rem;background:#ef4444;border-radius:4px;padding:1px 5px;margin-left:4px}
main{max-width:960px;margin:0 auto;padding:0 16px 40px}
h2{margin:32px 0 8px;font-size:1.5rem;border-bottom:2px solid var(--accent);padding-bottom:4px}
h3{margin:16px 0 8px;font-size:1.1rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
li a{display:block;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none}
li a:hover,li a:focus-visible{border-color:var(--accent);outline:none}
footer{text-align:center;padding:24px 16px;color:var(--muted);border-top:1px solid var(--line)}
footer a{color:var(--accent)}
</style>
</head>
