<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#29ca84"
  >

  <title>
    Zxsite - Exam Preparation
  </title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

</head>

<body>

  <header class="hero">

    <div class="hero-inner">

      <div class="brand">
        <span class="brand-z">Z</span>
        <span>xsite</span>
      </div>

      <div class="tagline">
        Your Ultimate Exam Preparation Platform
      </div>

    </div>

  </header>

  <section class="toolbar">

    <button
      id="menuBtn"
      class="menu-btn"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
      <i></i>
    </button>

    <div class="search-wrap">

      <input
        id="search"
        placeholder="Search batches..."
        autocomplete="off"
      >

      <span>⌕</span>

    </div>

    <div
      id="menuPopup"
      class="menu-popup"
      aria-hidden="true"
    >

      <button data-nav="home">
        <span>▤</span>
        Test Series
        <b>NEW</b>
      </button>

      <button data-nav="dpps">
        <span>▤</span>
        DPP's
      </button>

      <button data-nav="login">
        <span>↪</span>
        Login
      </button>

      <button data-nav="signup">
        <span>♟</span>
        Sign Up
      </button>

    </div>

  </section>

  <main id="app"></main>

  <a
    class="join"
    href="#join"
  >
    Join us
  </a>

  <a
    class="telegram"
    href="#telegram"
    aria-label="Telegram"
  >
    ➤
  </a>

  <script src="/app.js"></script>

</body>

</html>
