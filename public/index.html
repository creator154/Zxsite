<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepDesk - PW Test Series & Batches</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b1120; color: #f8fafc; padding: 20px; }
        .header { text-align: center; padding: 25px 0 15px; }
        .header h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.95rem; }
        
        .search-container { margin: 20px auto; max-width: 500px; }
        .search-container input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            background: #1e293b; 
            color: #fff; 
            font-size: 1rem;
            outline: none;
        }
        .search-container input:focus { border-color: #38bdf8; }

        .container { max-width: 500px; margin: auto; }
        .category-card { 
            background: #1e293b; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 14px; 
            border: 1px solid #334155; 
        }
        .category-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 1.1rem;
        }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-neet { background-color: #22c55e; }
        .dot-jee { background-color: #3b82f6; }
        .dot-boards { background-color: #f59e0b; }

        .badge { background: #334155; padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; color: #cbd5e1; }
        
        .batch-list { margin-top: 12px; display: none; }
        .batch-item { 
            background: #0f172a; 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border: 1px solid #1e293b;
        }
        .batch-name { font-size: 0.95rem; font-weight: 500; }
        .lang-tag { 
            font-size: 0.75rem; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-weight: bold;
        }
        .lang-hindi { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .lang-eng { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PrepDesk</h1>
        <p>Your Complete Exam Preparation Platform</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search batches, e.g. Yakeen, Lakshay..." onkeyup="filterBatches()">
    </div>

    <div class="container" id="categoriesContainer"></div>

    <script>
        // PW NEET & JEE Batches Data
        const DATA = [
            {
                category: "NEET Tests",
                dotClass: "dot-neet",
                batches: [
                    { name: "Yakeen NEET 2026 (Dropper)", lang: "Hindi" },
                    { name: "Yakeen NEET 2026 (Dropper)", lang: "English" },
                    { name: "Lakshya NEET 2026 (Class 12)", lang: "Hindi" },
                    { name: "Lakshya NEET 2026 (Class 12)", lang: "English" },
                    { name: "Arjuna NEET 2026 (Class 11)", lang: "Hindi" },
                    { name: "Arjuna NEET 2026 (Class 11)", lang: "English" }
                ]
            },
            {
                category: "JEE Tests",
                dotClass: "dot-jee",
                batches: [
                    { name: "Prayas JEE 2026 (Dropper)", lang: "Hindi" },
                    { name: "Prayas JEE 2026 (Dropper)", lang: "English" },
                    { name: "Lakshya JEE 2026 (Class 12)", lang: "Hindi" },
                    { name: "Lakshya JEE 2026 (Class 12)", lang: "English" },
                    { name: "Arjuna JEE 2026 (Class 11)", lang: "Hindi" },
                    { name: "Arjuna JEE 2026 (Class 11)", lang: "English" }
                ]
            }
        ];

        function renderData(dataToRender = DATA) {
            const container = document.getElementById("categoriesContainer");
            container.innerHTML = "";

            dataToRender.forEach((cat, index) => {
                const card = document.createElement("div");
                card.className = "category-card";

                const batchHTML = cat.batches.map(b => `
                    <div class="batch-item">
                        <span class="batch-name">${b.name}</span>
                        <span class="lang-tag ${b.lang === 'Hindi' ? 'lang-hindi' : 'lang-eng'}">${b.lang}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="category-header" onclick="toggleCategory(${index})">
                        <div>
                            <span class="dot ${cat.dotClass}"></span>
                            <span>${cat.category}</span>
                        </div>
                        <div>
                            <span class="badge">${cat.batches.length}</span> ▾
                        </div>
                    </div>
                    <div class="batch-list" id="batch-${index}">
                        ${batchHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleCategory(index) {
            const list = document.getElementById(`batch-${index}`);
            if(list) {
                list.style.display = list.style.display === "block" ? "none" : "block";
            }
        }

        function filterBatches() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            if (!query) {
                renderData();
                return;
            }

            const filteredData = DATA.map(cat => {
                const filteredBatches = cat.batches.filter(b => 
                    b.name.toLowerCase().includes(query) || b.lang.toLowerCase().includes(query)
                );
                return { ...cat, batches: filteredBatches };
            }).filter(cat => cat.batches.length > 0);

            renderData(filteredData);
            
            // Search karte waqt saare accordion open kar do
            filteredData.forEach((_, index) => {
                const list = document.getElementById(`batch-${index}`);
                if(list) list.style.display = "block";
            });
        }

        renderData();
    </script>
</body>
</html>
