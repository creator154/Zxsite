<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizard - PW Test Series</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding: 15px; }

        .app-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 10px;
        }

        .app-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input::placeholder { color: #64748b; }

        .category-card {
            background-color: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .category-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        .dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .dot-neet { background-color: #10b981; }
        .dot-jee { background-color: #3b82f6; }

        .count-badge {
            background-color: #3a506b;
            color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 6px;
        }

        .batch-container {
            display: none;
            background-color: #0b132b;
            padding: 10px;
            border-top: 1px solid #3a506b;
        }

        .batch-card {
            background-color: #1c2541;
            border: 1px solid #2a3d66;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .batch-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .badge-lang {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .hindi { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .english { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    </style>
</head>
<body>

    <h1 class="app-title">Quizard</h1>
    <p class="app-subtitle">Your Complete Exam Preparation Platform</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search batches, e.g. Yakeen, Lakshay..." onkeyup="filterData()">
    </div>

    <div id="mainContent"></div>

    <script>
        const DATA = [
            {
                title: "NEET Tests",
                dot: "dot-neet",
                batches: [
                    { name: "Yakeen NEET 2026 (Dropper)", lang: "Hindi" },
                    { name: "Yakeen NEET 2026 (Dropper)", lang: "English" },
                    { name: "Lakshya NEET 2026 (Class 12)", lang: "Hindi" },
                    { name: "Lakshya NEET 2026 (Class 12)", lang: "English" },
                    { name: "Arjuna NEET 2026 (Class 11)", lang: "Hindi" },
                    { name: "Arjuna NEET 2026 (Class 11)", lang: "English" }
                ]
            },
            {
                title: "JEE Tests",
                dot: "dot-jee",
                batches: [
                    { name: "Prayas JEE 2026 (Dropper)", lang: "Hindi" },
                    { name: "Prayas JEE 2026 (Dropper)", lang: "English" },
                    { name: "Lakshya JEE 2026 (Class 12)", lang: "Hindi" },
                    { name: "Lakshya JEE 2026 (Class 12)", lang: "English" },
                    { name: "Arjuna JEE 2026 (Class 11)", lang: "Hindi" },
                    { name: "Arjuna JEE 2026 (Class 11)", lang: "English" }
                ]
            }
        ];

        function render(data) {
            const container = document.getElementById("mainContent");
            container.innerHTML = "";

            data.forEach((cat, index) => {
                const card = document.createElement("div");
                card.className = "category-card";

                const batchesHTML = cat.batches.map(b => `
                    <div class="batch-card">
                        <span class="batch-title">${b.name}</span>
                        <span class="badge-lang ${b.lang.toLowerCase()}">${b.lang}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="category-header" onclick="toggle(${index})">
                        <div>
                            <span class="dot ${cat.dot}"></span>
                            <span>${cat.title}</span>
                        </div>
                        <div>
                            <span class="count-badge">${cat.batches.length}</span>
                            <span>▾</span>
                        </div>
                    </div>
                    <div class="batch-container" id="batch-box-${index}">
                        ${batchesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggle(index) {
            const el = document.getElementById(`batch-box-${index}`);
            el.style.display = el.style.display === "block" ? "none" : "block";
        }

        function filterData() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            if(!query) {
                render(DATA);
                return;
            }

            const filtered = DATA.map(cat => {
                const sub = cat.batches.filter(b => b.name.toLowerCase().includes(query) || b.lang.toLowerCase().includes(query));
                return { ...cat, batches: sub };
            }).filter(cat => cat.batches.length > 0);

            render(filtered);
            filtered.forEach((_, idx) => {
                const el = document.getElementById(`batch-box-${idx}`);
                if(el) el.style.display = "block";
            });
        }

        render(DATA);
    </script>
</body>
</html>
