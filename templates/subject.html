{% extends "base.html" %}

{% block title %}{{ subject.name }}{% endblock %}

{% block content %}

<section class="container">

<h1>{{ subject.name }}</h1>

<div class="grid">

{% for test in tests %}

<div class="card">

<img src="{{ test.thumbnail }}">

<h3>{{ test.title }}</h3>

<p>{{ test.type }}</p>

<p>{{ test.questions }} Questions</p>

<a href="/test/{{ test.id }}">
Open Test
</a>

</div>

{% endfor %}

</div>

</section>

{% endblock %}
