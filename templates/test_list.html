{% extends "base.html" %}

{% block title %}Tests{% endblock %}

{% block content %}

<section class="container">

<h1>Available Tests</h1>

{% for test in tests %}

<div class="test-card">

<div>

<h2>{{ test.title }}</h2>

<p>{{ test.type }}</p>

<p>{{ test.questions }} Questions</p>

<p>{{ test.duration }} Minutes</p>

</div>

<a href="/instructions/{{ test.id }}">
Start
</a>

</div>

{% endfor %}

</section>

{% endblock %}
